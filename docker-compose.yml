# Local development services only. Not for production.
# Values come from the root .env file (copy .env.example). All ports bind to localhost.
name: jaxapp

services:
  postgres:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: jax_dev
    ports:
      # 5432 is already used on the dev machine.
      - '127.0.0.1:${POSTGRES_PORT:-5433}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init/10-test-db.sql:/docker-entrypoint-initdb.d/90-jax-test-db.sql:ro
    healthcheck:
      # TCP (-h) so the check fails during first-boot init, which listens on the socket only.
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U "$$POSTGRES_USER" -d jax_dev']
      interval: 3s
      timeout: 3s
      retries: 20

  # S3-compatible object storage (D13). MinIO no longer publishes community images,
  # so SeaweedFS is used for local dev. The app only speaks the S3 API.
  s3:
    image: chrislusf/seaweedfs:4.47
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?set in .env}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?set in .env}
    entrypoint: ['/bin/sh', '-c']
    command:
      - |
        printf '{"identities":[{"name":"jax-dev","credentials":[{"accessKey":"%s","secretKey":"%s"}],"actions":["Admin","Read","Write","List","Tagging"]}]}' "$$S3_ACCESS_KEY" "$$S3_SECRET_KEY" > /tmp/s3.json
        exec weed server -dir=/data -s3 -s3.port=8333 -s3.config=/tmp/s3.json -master.volumeSizeLimitMB=64 -volume.max=0
    ports:
      - '127.0.0.1:${S3_PORT:-8333}:8333'
    volumes:
      - s3data:/data
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1:9333/cluster/status || exit 1']
      interval: 3s
      timeout: 3s
      retries: 30

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - '127.0.0.1:${SMTP_PORT:-1025}:1025'
      - '127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025'
    healthcheck:
      test: ['CMD', '/mailpit', 'readyz']
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
  s3data:
